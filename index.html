<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>碎影 Torn Portraits</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Playfair+Display:ital,wght@0,700;0,800;1,500&family=Nunito:wght@700;800;900&family=Caveat:wght@600&display=swap">
<style>
/* Look: warm coastal heirloom mystery. Painted parts (ui/) carry material; CSS only lays out, adds hairlines and motion.
   One center axis, 8px steps. Primary action = sea-green plate, reveal/unlock = champagne gold, secondary = cream. */
:root{
  --ink:#2a2622; --ink2:#5b4a3c; --ink-soft:rgba(42,38,34,.62);
  --cream:#faf3e6; --paper:#fffaf0; --walnut:#5c3d2e; --brass:#c99a4e; --brass-d:#9a7232;
  --green:#2fa56e; --coral:#e2553f; --gold:#f2b23a; --teal:#1f5560; --night:#121a24;
  --serif:"Playfair Display","Noto Serif SC","Songti SC","STSong",serif;
  --cn-serif:"Noto Serif SC","Songti SC","STSong",serif;
  --body:"Nunito",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --hand:"Caveat","Kaiti SC","STKaiti",cursive;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#0d1219;color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:relative;height:100%;max-width:460px;margin:0 auto;overflow:hidden;background:var(--night)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:900;text-wrap:balance}
img{max-width:none;-webkit-user-drag:none}
.ico{width:26px;height:26px;object-fit:contain;flex:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}

/* ---------- scene ground ---------- */
.scene{position:absolute;inset:0;overflow:hidden;background:#d9cdb8}
.scene canvas,.scene>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene .next{opacity:0;transition:opacity 1.4s ease}
.scene .next.on{opacity:1}
.kb{animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.06) translate(-1%,-1%)}}

/* ---------- painted parts ---------- */
.btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:62px;padding:6px 34px 12px;font-family:var(--cn-serif);font-weight:900;font-size:21px;letter-spacing:.04em;color:#fff;text-shadow:0 2px 0 rgba(10,70,40,.55);
  border-style:solid;border-width:0 31px;border-image:url(ui/btn_green.png) 0 var(--capg,120) fill / 0 31px / 0 stretch;transition:transform .08s,filter .2s}
.btn small{font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:.02em;opacity:.92;margin-top:1px;text-shadow:none}
.btn:active{transform:translateY(3px) scale(.985)}
.btn.gold{border-image-source:url(ui/btn_gold.png);color:#5a3505;text-shadow:0 1px 0 rgba(255,240,200,.7)}
.btn.cream{border-image-source:url(ui/btn_cream.png);color:var(--walnut);text-shadow:none;font-size:17px;min-height:52px}
.btn.pulse{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.035)}}
.btn[disabled]{filter:grayscale(1) brightness(1.05);opacity:.55;pointer-events:none}
.btn .bi{position:absolute;left:4px;top:50%;width:32px;height:32px;transform:translateY(-58%);object-fit:contain}
.rb{position:relative;width:56px;height:58px;display:grid;place-items:center;background:url(ui/rb_ivory.png) center/contain no-repeat;flex:none;transition:transform .08s}
.rb:active{transform:translateY(2px) scale(.96)}
.rb.wood{background-image:url(ui/rb_walnut.png)}
.rb img{width:32px;height:32px;object-fit:contain;margin-top:-4px}
.rb .badge{position:absolute;top:-2px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--coral);color:#fff;font-weight:900;font-size:12px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--paper)}
.rb .lbl{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:800;color:var(--paper);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.rb .dot{position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--paper);animation:pulse 1.2s infinite}
.pause-ico{width:16px;height:18px;margin-top:-4px;border-left:5px solid #fff3dc;border-right:5px solid #fff3dc}
.cap-res{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 6px;min-width:84px;color:#fff;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums;
  border-style:solid;border-width:0 18px;border-image:url(ui/capsule.png) 0 var(--capc,60) fill / 0 18px / 0 stretch;padding:0 2px}
.cap-res .ico{margin-left:-12px;width:30px;height:30px}
.panel{position:relative;border-style:solid;border-width:var(--pw,30px);border-image:url(ui/panel.png) var(--ps,90) fill / var(--pw,30px) / 0 stretch}
.ribbon{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;height:54px;color:#fff6e2;font-family:var(--cn-serif);font-weight:900;font-size:18px;text-shadow:0 2px 0 rgba(0,0,0,.25);
  border-style:solid;border-width:0 44px;border-image:url(ui/ribbon.png) 0 var(--capr,150) fill / 0 44px / 0 stretch;padding-bottom:4px}
.nametag{display:inline-flex;align-items:baseline;gap:8px;height:38px;padding:0 4px;color:#fff3dc;font-family:var(--cn-serif);font-weight:900;font-size:17px;line-height:38px;
  border-style:solid;border-width:0 18px;border-image:url(ui/nametag.png) 0 var(--capn,60) fill / 0 18px / 0 stretch;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.nametag small{font-family:var(--body);font-size:11px;font-weight:800;opacity:.8;letter-spacing:.04em}
.kicker{font-family:var(--body);font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--brass-d)}

/* ---------- title ---------- */
#title .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(24,16,10,.88) 0%,rgba(24,16,10,.55) 34%,rgba(24,16,10,0) 58%),linear-gradient(180deg,rgba(24,16,10,.35),rgba(24,16,10,0) 22%)}
#title .over{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding-bottom:calc(28px + var(--sab));gap:14px}
.logo{display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff6e4}
.logo .case{font-family:var(--body);font-weight:900;font-size:11px;letter-spacing:.32em;color:#f3d79b;padding:4px 12px;border:1px solid rgba(243,215,155,.5);border-radius:2px;margin-bottom:8px}
.logo h1{font-family:var(--cn-serif);font-size:64px;line-height:1;letter-spacing:.16em;margin-right:-.16em;text-shadow:0 3px 18px rgba(0,0,0,.5);position:relative;overflow:hidden}
.logo h1::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,240,200,.55) 50%,transparent 70%);transform:translateX(-120%);animation:shine 4.5s 1s infinite}
@keyframes shine{30%,100%{transform:translateX(120%)}}
.logo .en{font-family:var(--serif);font-style:italic;font-weight:500;font-size:22px;color:#f3d79b;letter-spacing:.06em}
.logo .rule{display:flex;align-items:center;gap:10px;margin-top:10px;color:#f3d79b}
.logo .rule i{width:42px;height:1px;background:currentColor;opacity:.6}
.tagline{font-family:var(--cn-serif);font-weight:600;font-size:16px;line-height:1.7;color:#f6ead4;max-width:300px;margin:4px 0 6px}
#title .btn{max-width:320px}
.linkbtn{font-size:13px;font-weight:800;color:rgba(246,234,212,.75);padding:6px 12px}
.load{width:220px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.load b{display:block;height:100%;width:0;background:#f3d79b;transition:width .2s}

/* ---------- HUD ---------- */
.hud{position:relative;z-index:3;display:flex;align-items:center;gap:8px;padding-top:calc(10px + var(--sat))}
.spacer{flex:1}

/* ---------- home ---------- */
#home .scene::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(20,14,8,.35),rgba(20,14,8,0) 20%,rgba(20,14,8,0) 52%,rgba(20,14,8,.55) 80%,rgba(20,14,8,.75))}
#home .over{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;min-height:0}
.chrib{margin:10px auto 0;width:min(100%,360px);cursor:pointer}
.chrib .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slots{display:flex;gap:2px;align-items:center}
.slots img{width:24px;height:24px}
.slots img.pop{animation:spop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes spop{from{transform:scale(2.2)}}
.chsub{text-align:center;margin-top:4px;font-size:12px;font-weight:800;color:#fff3dc;text-shadow:0 1px 3px rgba(0,0,0,.7);letter-spacing:.08em}
.marker{position:absolute;z-index:1;width:56px;height:56px;margin:-28px 0 0 -28px;pointer-events:none}
.marker::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,236,170,.95) 0 18%,rgba(255,210,110,.45) 34%,rgba(255,210,110,0) 68%);animation:breathe 1.8s ease-in-out infinite}
.marker img{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);animation:bob 1.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.3);opacity:.7}}
@keyframes bob{50%{transform:translate(-50%,-62%)}}
.dock{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(22px + var(--sab))}
.lvcard{display:flex;gap:12px;align-items:center;--pw:22px;--ps:70}
.lvcard .th{width:58px;height:78px;flex:none;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);background:center/cover;transform:rotate(-3deg)}
.lvcard .th.story{background-color:#2b2420}
.lvcard .kicker{display:flex;gap:8px;align-items:center}
.lvcard h3{font-family:var(--cn-serif);font-size:20px;line-height:1.2;color:var(--ink);margin-top:2px}
.lvcard p{margin:4px 0 0;font-family:var(--cn-serif);font-weight:600;font-size:14px;line-height:1.5;color:var(--ink2)}
.hard{display:inline-block;font-family:var(--body);font-size:11px;font-weight:900;letter-spacing:.08em;color:#fff;background:linear-gradient(180deg,#e2553f,#b8361f);padding:2px 8px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(255,220,180,.5)}
.dockrow{display:flex;align-items:center;gap:12px}
.dockrow .btn{flex:1}

/* ---------- play ---------- */
#play .bg{position:absolute;inset:0;background:#6b4a33 center/cover no-repeat}
#play .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 45%,rgba(0,0,0,.35) 100%);transition:background .8s}
#play.cine .bg::after{background:radial-gradient(ellipse at 50% 46%,rgba(8,10,16,.25) 0%,rgba(8,10,16,.9) 70%)}
#play .top{position:relative;z-index:3;transition:opacity .4s}
#play.cine .top,#play.cine .tools{opacity:0;pointer-events:none}
.lvname{display:flex;flex-direction:column;min-width:0}
.lvname small{font-size:11px;font-weight:900;letter-spacing:.12em;color:#f3d79b;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.lvname b{font-family:var(--cn-serif);font-size:19px;color:#fff6e4;text-shadow:0 2px 4px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{display:flex;align-items:center;gap:6px;height:40px;padding:0 6px;min-width:112px;color:#fff;font-weight:900;font-size:19px;font-variant-numeric:tabular-nums;border-style:solid;border-width:0 20px;border-image:url(ui/capsule.png) 0 var(--capc,60) fill / 0 20px / 0 stretch}
.timer .ico{margin-left:-14px;width:30px;height:30px}
.timer.low{color:#ffb4a6;animation:beat .6s ease-in-out infinite}
.timer.low .ico{animation:tilt .6s infinite}
@keyframes beat{50%{transform:scale(1.07)}}
@keyframes tilt{50%{transform:rotate(14deg)}}
.tbar{height:6px;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:10px;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.tbar b{display:block;height:100%;width:100%;transform-origin:left;background:linear-gradient(180deg,#7fe0a8,#2fa56e);transition:background .4s}
.tbar.mid b{background:linear-gradient(180deg,#ffd879,#e9a320)}
.tbar.low b{background:linear-gradient(180deg,#ff9a85,#e2553f)}
.tbar.off{visibility:hidden}
.hookline{margin-top:10px;text-align:center;font-family:var(--cn-serif);font-weight:600;font-size:15px;line-height:1.5;color:#fff6e4;text-shadow:0 1px 4px rgba(0,0,0,.7);min-height:23px}
.stage{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:14px}
.frame{position:relative;background:#3a2c22;outline:10px solid #fbf6ec;box-shadow:0 0 0 11px rgba(154,114,50,.55),0 22px 40px rgba(0,0,0,.45);transition:transform .6s cubic-bezier(.5,0,.2,1),opacity .5s}
.frame.story{outline-color:#fdfaf3;transform:rotate(-1.2deg);box-shadow:0 0 0 11px rgba(0,0,0,.08),0 26px 50px rgba(0,0,0,.6)}
.frame.story::after{content:attr(data-label);position:absolute;left:0;right:0;bottom:-44px;height:34px;background:#fdfaf3;font-family:var(--hand);font-size:24px;color:#6b5a4a;text-align:center;line-height:30px}
.frame.story{margin-bottom:34px}
.frame.fly{transform:translate(42%,-62%) scale(.18) rotate(8deg);opacity:0}
.tile{position:absolute;left:0;top:0;background-repeat:no-repeat;background-color:#4a3a2e;transition:translate .18s cubic-bezier(.22,1.3,.36,1),clip-path .18s;touch-action:none;cursor:grab}
.tile.drag{transition:none;z-index:5;filter:brightness(1.08) drop-shadow(0 12px 14px rgba(0,0,0,.55))}
.tile.snap{animation:snap .45s}
.tile.hinted{animation:hinted .9s 2}
@keyframes snap{35%{filter:brightness(1.45) saturate(1.1)}}
@keyframes hinted{50%{filter:brightness(1.5) drop-shadow(0 0 8px #ffd879)}}
.tile.dark{cursor:not-allowed}
.tile .back{position:absolute;inset:0;background:url(ui/photo_back.webp) center/cover;box-shadow:inset 0 0 0 1px rgba(120,90,50,.35);backface-visibility:hidden}
.tile.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.tile.flip3d{animation:flip3d .8s cubic-bezier(.3,0,.2,1)}
@keyframes flip3d{0%{transform:perspective(700px) rotateY(0)}50%{transform:perspective(700px) rotateY(90deg) scale(1.08)}100%{transform:perspective(700px) rotateY(0)}}
.whole{position:absolute;inset:0;background-repeat:no-repeat;opacity:0;transition:opacity .35s;pointer-events:none;z-index:6}
.whole.on{opacity:1}
.sweep{position:absolute;inset:0;z-index:7;pointer-events:none;overflow:hidden}
.sweep::after{content:"";position:absolute;top:-20%;bottom:-20%;width:45%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,250,230,.75),transparent);transform:skewX(-18deg);animation:sweep .9s ease-out forwards}
@keyframes sweep{to{left:120%}}
.zoom{position:absolute;inset:0;overflow:hidden;z-index:8}
.zoom img{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;transition:transform 2.8s cubic-bezier(.55,0,.15,1)}
.ring{position:absolute;z-index:9;pointer-events:none;overflow:visible}
.ring ellipse{fill:none;stroke:#e2402a;stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));animation:draw .6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cap{min-height:64px;width:100%;display:grid;place-items:center;text-align:center}
.cap span{font-family:var(--cn-serif);font-weight:900;font-size:21px;line-height:1.45;color:#fff6e4;padding:10px 18px;background:linear-gradient(90deg,rgba(10,10,14,0),rgba(10,10,14,.78) 18%,rgba(10,10,14,.78) 82%,rgba(10,10,14,0));animation:rise .7s both;text-wrap:balance;max-width:100%}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.tools{position:relative;z-index:3;display:flex;gap:36px;align-items:flex-start;justify-content:center;padding-bottom:calc(36px + var(--sab));min-height:104px;transition:opacity .4s}
.peek{position:absolute;inset:0;background-repeat:no-repeat;z-index:8;pointer-events:none;animation:fade .2s both}
.hand{position:absolute;z-index:12;width:54px;height:54px;pointer-events:none;margin:-8px 0 0 -14px}
.hand svg{width:100%;height:100%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.tip{position:absolute;z-index:12;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--cn-serif);font-weight:900;font-size:15px;color:var(--ink);background:var(--paper);padding:8px 14px;border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.35);animation:rise .4s both}
.tip::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;margin-left:-6px;background:var(--paper);transform:rotate(45deg)}
.praise{position:absolute;z-index:11;font-family:var(--serif);font-style:italic;font-weight:800;font-size:30px;color:#ffe08a;-webkit-text-stroke:1px #8a5a12;text-shadow:0 3px 0 #8a5a12,0 6px 12px rgba(0,0,0,.4);pointer-events:none;animation:praise 1s ease-out forwards;white-space:nowrap}
@keyframes praise{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-120%) scale(1);opacity:0}}

/* ---------- modal ---------- */
.veil{position:absolute;inset:0;z-index:40;background:rgba(10,8,6,.6);display:flex;align-items:center;justify-content:center;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.modal{width:min(100% - 32px,340px);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;--pw:30px;--ps:90;animation:pop .35s cubic-bezier(.3,1.5,.5,1) both;margin-top:30px}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.modal .medal{width:84px;height:84px;margin:-74px 0 -6px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fffaf0,#f1e2c4);box-shadow:0 0 0 4px var(--brass),0 8px 18px rgba(0,0,0,.35)}
.modal .medal img{width:56px;height:56px;object-fit:contain}
.modal h3{font-family:var(--cn-serif);font-size:26px;color:var(--ink)}
.modal p{margin:0;color:var(--ink2);font-weight:700;font-size:14px}
.modal .x{position:absolute;top:-16px;right:-16px;width:36px;height:36px;border-radius:50%;background:#fffaf0;box-shadow:0 0 0 2px var(--brass),0 3px 8px rgba(0,0,0,.3);display:grid;place-items:center;font-size:20px;font-weight:900;color:var(--ink2)}
.prog{width:100%;height:14px;border-radius:7px;background:#e6d6b8;box-shadow:inset 0 1px 3px rgba(0,0,0,.25);overflow:hidden;position:relative}
.prog b{display:block;height:100%;background:linear-gradient(180deg,#7fe0a8,#2fa56e);border-radius:7px}
.prog span{position:absolute;inset:0;font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.5);line-height:14px}
.modal .btn{margin-top:2px;font-size:18px;white-space:nowrap}
.gains{display:flex;gap:18px;justify-content:center;align-items:center;font-weight:900;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.gains span{display:flex;align-items:center;gap:6px}
.gains .ico{width:34px;height:34px}
.bigstar{width:96px;height:96px;margin:-82px 0 -8px;animation:starin .7s cubic-bezier(.3,1.6,.5,1) both;filter:drop-shadow(0 6px 10px rgba(120,70,0,.45))}
@keyframes starin{from{transform:scale(0) rotate(-180deg)}}

/* ---------- dialogue ---------- */
#dlg .scene canvas{filter:blur(3px) saturate(.95);transform:scale(1.05)}
#dlg .scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,12,6,.25),rgba(18,12,6,.05) 30%,rgba(18,12,6,.55) 75%,rgba(18,12,6,.85))}
#dlg .busts{position:absolute;inset:0;z-index:1;pointer-events:none}
#dlg .busts img{position:absolute;bottom:calc(150px + var(--sab));height:56%;opacity:0;transition:transform .35s cubic-bezier(.3,1.3,.5,1),opacity .3s,filter .3s;filter:drop-shadow(0 12px 24px rgba(0,0,0,.35))}
#dlg .busts .l{left:-22%;transform:translateX(-30px)} #dlg .busts .r{right:-18%;transform:translateX(30px)}
#dlg .busts img.in{opacity:1;transform:scale(.94);filter:brightness(.55) saturate(.7) drop-shadow(0 12px 24px rgba(0,0,0,.35))}

/* ================= fx canvas ================= */
const FX = {c: null, x: null, ps: [], on: false};
function fxInit() { FX.c = $('#fx'); FX.x = FX.c.getContext('2d'); const r = () => { const b = $('#app').getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); FX.c.width = b.width * d; FX.c.height = b.height * d; FX.x.setTransform(d, 0, 0, d, 0, 0); }; r(); addEventListener('resize', r); }
function burst(x, y, n, opt) {
  opt = opt || {};
  const cols = opt.cols || ['#ffe28a', '#fff6d0', '#f2b23a', '#ffffff'];
  for (let i = 0; i < n; i++) {
    const a = opt.up ? -Math.PI / 2 + (Math.random() - .5) * 1.6 : Math.random() * Math.PI * 2, sp = (opt.speed || 3) * (.4 + Math.random());
    FX.ps.push({x: x + (opt.w ? (Math.random() - .5) * opt.w : 0), y: y + (opt.h ? (Math.random() - .5) * opt.h : 0), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: opt.g ?? .08, life: 1, dec: .012 + Math.random() * .02, r: (opt.r || 3) * (.5 + Math.random()), c: cols[i % cols.length], star: Math.random() < .5});
  }
  if (!FX.on) { FX.on = true; requestAnimationFrame(fxLoop); }
}
function fxLoop() {
  const x = FX.x, b = FX.c.getBoundingClientRect(); x.clearRect(0, 0, b.width, b.height);
  FX.ps = FX.ps.filter(p => p.life > 0);
  for (const p of FX.ps) {
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .985; p.life -= p.dec;
    x.globalAlpha = Math.max(0, p.life); x.fillStyle = p.c;
    if (p.star) { x.save(); x.translate(p.x, p.y); x.rotate(p.life * 6); x.beginPath(); for (let k = 0; k < 4; k++) { x.lineTo(0, -p.r * 2); x.rotate(Math.PI / 4); x.lineTo(0, -p.r * .6); x.rotate(Math.PI / 4); } x.fill(); x.restore(); }
    else { x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill(); }
  }
  x.globalAlpha = 1;
  if (FX.ps.length) requestAnimationFrame(fxLoop); else FX.on = false;
}
const appXY = el => { const a = $('#app').getBoundingClientRect(), b = el.getBoundingClientRect(); return [b.left - a.left + b.width / 2, b.top - a.top + b.height / 2, b.width, b.height]; };

/* ================= room composer ================= */
const RW = 900, RH = 1350, CACHE = {};
function featherLayer(img, rects, fe) {
  const c = document.createElement('canvas'); c.width = RW; c.height = RH; const x = c.getContext('2d');
  x.save(); x.shadowColor = '#000'; x.shadowBlur = fe; x.shadowOffsetX = RW * 3;
  rects.forEach(([rx, ry, rw, rh]) => {
    const full = rx <= 0 && ry <= 0 && rw >= 1 && rh >= 1, inset = full ? -fe * 2 : fe * .55;
    x.fillRect(rx * RW + inset - RW * 3, ry * RH + inset, rw * RW - inset * 2, rh * RH - inset * 2);
  });
  x.restore(); x.globalCompositeOperation = 'source-in'; x.drawImage(img, 0, 0, RW, RH);
  return c;
}
async function roomCanvas(level) {
  if (CACHE[level]) return CACHE[level];
  const c = document.createElement('canvas'); c.width = RW; c.height = RH; const x = c.getContext('2d');
  const before = await loadImg(src('roomBefore')), clean = await loadImg(src('roomClean'));
  x.drawImage(before, 0, 0, RW, RH);
  for (let k = 0; k < Math.min(level, 5); k++) x.drawImage(featherLayer(clean, RENO[k].rects, 70), 0, 0);
  return CACHE[level] = c;
}
function cloneCanvas(c) { const d = document.createElement('canvas'); d.width = c.width; d.height = c.height; d.getContext('2d').drawImage(c, 0, 0); return d; }
async function paintScene(box, level) {
  const c = cloneCanvas(await roomCanvas(level));
  box.innerHTML = ''; box.appendChild(c); return c;
}
// map image fraction -> px inside an object-fit:cover box
function coverXY(box, fx, fy) {
  const w = box.clientWidth, h = box.clientHeight, s = Math.max(w / RW, h / RH);
  return [(w - RW * s) / 2 + fx * RW * s, (h - RH * s) / 2 + fy * RH * s];
}
function cropURL(img, fx, fy, fw, fh, size) {
  const c = document.createElement('canvas'); c.width = c.height = size || 200; const iw = img.naturalWidth, ih = img.naturalHeight;
  const sw = fw * iw, sh = (fh || fw * iw / ih) * ih, s = Math.min(sw, sh);
  c.getContext('2d').drawImage(img, fx * iw, fy * ih, s, s, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .85);
}

let FLOW = [];
function buildFlow() {
  FLOW = [];
  SCRIPT.chapters.forEach((ch, ci) => {
    const c = ci + 1;
    FLOW.push({t:'dlg', lines:ch.intro, ch:c, flag:'c' + c});
    ch.levels.forEach((L, li) => {
      FLOW.push({t:'lvl', id:L.id, ch:c, k:li});
      if (L.post && L.post.length) FLOW.push({t:'dlg', lines:L.post, ch:c});
    });
    FLOW.push({t:'task', ch:c});
    FLOW.push({t:'dlg', lines:ch.story_pre, ch:c});
    FLOW.push({t:'story', id:'S' + c, ch:c});
    FLOW.push({t:'dlg', lines:ch.story_post, ch:c, flag:'s' + c});
    FLOW.push({t:'reno', ch:c});
    FLOW.push({t:'chap', ch:c});
  });
  FLOW.push({t:'dlg', lines:SCRIPT.teaser, ch:5});
  FLOW.push({t:'end'});
}
function next() { S.step++; save(); run(); }
function run() {
  const st = FLOW[S.step];
  if (!st) return showEnd();
  if (st.t === 'dlg') return playDialogue(st.lines, () => { if (st.flag) flag(st.flag); next(); });
  if (st.t === 'lvl' || st.t === 'task') return showHome();
  if (st.t === 'story') return startLevel(storyLevel(st.id), () => { flag('p' + st.id.slice(1)); next(); });
  if (st.t === 'reno') return showReno(st.ch);

}

  if (L.tut && !S.tutDone) { S.tutDone = 1; save(); showTut(); }
}
$('#hintBtn').onclick = () => {
  if (!G || G.over || G.paused) return;
  sfx.tap();
  if (S.hints > 0) { S.hints--; save(); $('#hintN').textContent = S.hints; return G.hint(); }
  G.paused = true;
  modal({title:'放大镜用完了', medal:ic('loupe'), actions:[
    ['看广告 提示 +1', '', () => fakeAd(() => { G.paused = false; G.hint(); }), ic('photo')],
    [`<span style="display:flex;align-items:center;gap:6px"><img class="ico" src="${ic('coin')}" alt="">60 提示 +1</span>`, 'gold', () => { G.paused = false; if (S.coins >= 60) { S.coins -= 60; save(); G.hint(); } else toast('金币不够'); }],
  ], close:() => { G.paused = false; }});
};
(() => {
  const pb = $('#peekBtn'); let pv = null, timer = null;
  const on = () => { if (!G || G.over || pv) return; pv = document.createElement('div'); pv.className = 'peek'; pv.style.backgroundImage = `url(${G.img})`; pv.style.backgroundSize = G.bgSize; pv.style.backgroundPosition = `${G.bx0}px ${G.by0}px`; $('#frame').appendChild(pv); };
  const off = () => { clearTimeout(timer); if (pv) { pv.remove(); pv = null; } };
  pb.onpointerdown = e => { e.preventDefault(); sfx.paper(); on(); clearTimeout(timer); timer = setTimeout(off, 1600); };
})();
$('#pauseBtn').onclick = () => {
  if (!G || G.over) return;
  G.paused = true; sfx.tap();
  const story = !!G.L.story;
  modal({title:'暂停', actions:[
    ['继续', '', () => { G.paused = false; }],
    ['直接过关<small>试玩用</small>', 'cream', () => { G.paused = false; G.solve(); }],
    ...(story ? [] : [['退出这一关<small>扣 1 点体力</small>', 'cream', () => { G.over = true; clearInterval(G.tick); S.lives = Math.max(0, S.lives - 1); save(); showHome(); }]]),
  ]});
};

/* ================= boot ================= */
(() => {
  SCRIPT = JSON.parse(SCRIPT_JSON);
  buildFlow(); fxInit();
  $('#titleImg').src = src('title');
  const files = [...new Set(Object.values(PIC))].map(f => IMG + f).concat(UIFILES.map(f => UI + f));
  let done = 0;
  const btn = $('#startBtn'), bar = $('#loadbar b');
  const tick = () => { done++; bar.style.width = (done / files.length * 100) + '%'; if (done >= files.length) { $('#loadbar').hidden = true; btn.hidden = false; btn.textContent = hadSave ? '继续调查' : '开始调查'; $('#resetBtn').hidden = !hadSave; } };
  files.forEach(f => loadImg(f).then(tick));
  btn.onclick = () => { sfx.tap(); run(); };
  $('#resetBtn').onclick = () => { S = structuredClone(DEF); save(); for (const k in CACHE) delete CACHE[k]; run(); };
})();
</script>

</html>
